---
# ============================================================
# TYPE: ssl_plain_rbac
# SECRECT: ON / SSL: ON / TLS: one-way / SASL: PLAIN / RBAC: ON / LDAP: ON / OIDC: ON
# 용도: 내부망 암호화 구성, LDAP/RBAC 추가하여 보안 강화 운영
# ============================================================
all:
  vars:
    ansible_connection: ssh
    ansible_user: ansible
    ansible_python_interpreter: /usr/bin/python3.9
    ansible_become: true
    ansible_port: 22
    ansible_strategy: parallel
      #deployment_strategy: rolling
    deployment_strategy: parallel
    confluent_package_version: "8.1.2"
    confluent_control_center_next_gen_package_version: "2.5.0"
    confluent_cli_archive_file_remote: false
    confluent_cli_download_enabled: false
    confluent_cli_path: /app/kafka/confluent/confluent-8.1.2/bin/confluent
    #confluent_license: "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9..iORtC3VErsDZdKt-vk2rsRUNMGzfQiPDXbPv_4ebnPzP_1W7pUgOvr_LUhdj6PjDP19X0mSeQfqeBsV5ilq9zhekB1JkCsSIwas_Jq5hhsj3upsCBZx3VKxwnSL7fPhfs9F2RBgacWJbp78PeJ1cLP"        
    confluent_license: ""

    ### JVM installation ###
    install_java: false
    custom_java_path: /usr/lib/jvm/java-21
    sasl_protocol: plain
    kafka_controller_sasl_protocol: plain

    #SSL Config - [ssl_plain] SSL 활성화
    #keystore_expiration_days: 1095
    #certificate_authority_expiration_days: 1095
    ssl_file_dir: /app/kafka/confluent/etc/ssl
    ssl_keystore_and_truststore_custom_password: true
    ssl_enabled: true
      #kafka_controller_ssl_enabled: true
      #control_center_next_gen_ssl_enabled: true
      #schema_registry_ssl_enabled: true
      #kafka_broker_rest_ssl_enabled: true
     
    #if ssl_enabled true, use below two options
    ssl_client_authentication: none
    ssl_mutual_auth_enabled: false

    kafka_controller_keystore_storepass: nextsec!@34
    kafka_controller_keystore_keypass: nextsec!@34
    kafka_controller_truststore_storepass: nextsec!@34
    kafka_broker_keystore_storepass: nextsec!@34
    kafka_broker_keystore_keypass: nextsec!@34
    kafka_broker_truststore_storepass: nextsec!@34
    schema_registry_keystore_storepass: nextsec!@34
    schema_registry_keystore_keypass: nextsec!@34
    schema_registry_truststore_storepass: nextsec!@34
    control_center_next_gen_keystore_storepass: nextsec!@34
    control_center_next_gen_keystore_keypass: nextsec!@34
    control_center_next_gen_truststore_storepass: nextsec!@34

    sasl_plain_users:
      admin:
        principal: admin
        password: nextsec!@34
    kafka_broker_inter_broker_listener_name: internal
    kafka_broker_rest_proxy_listener_name: internal_token
    schema_registry_kafka_listener_name: internal_token
    kafka_broker_custom_listeners:
      internal:
        name: INTERNAL
        port: 9091
        sasl_protocol: plain
      broker:
        name: EXTERNAL
        port: 9092
        sasl_protocol: oauth
      internal_token:
        name: TOKEN
        port: 9094
        sasl_protocol: oauth

    installation_method: archive
    confluent_archive_file_source: /home/ansible/confluent_install/3.confluent/confluent-8.1.2.zip
    confluent_archive_file_remote: false
    archive_destination_path: /app/kafka/confluent
    archive_owner: ansible
    archive_group: ansible

    kafka_broker_user: cp-kafka
    kafka_broker_group: confluent
    kafka_controller_user: cp-kafka
    kafka_controller_group: confluent
    control_center_next_gen_user: cp-control-center
    control_center_next_gen_group: confluent
    schema_registry_user: cp-schema-registry
    schema_registry_group: confluent
    
    kafka_controller_log_dir: /log/kafka/confluent/controller
    kafka_broker_log_dir: /log/kafka/confluent/broker
    control_center_next_gen_log_dir: /log/kafka/confluent/c3
    schema_registry_log_dir: /log/kafka/confluent/schema-registry

    # Secret - [ssl_plain] 비활성화
    secrets_protection_enabled: true
    secrets_protection_masterkey: "{{ lookup('env', 'CONFLUENT_SECURITY_MASTER_KEY') }}"
    regenerate_masterkey: false


    # C3 config
    confluent_archive_control_center_next_gen_file_remote: false
    confluent_archive_control_center_next_gen_file_source: /home/ansible/confluent_install/3.confluent/confluent-control-center-next-gen-2.5.0.tar.gz
    #control_center_next_gen_port: 8080
    control_center_next_gen_authentication_type: ldap
    control_center_next_gen_dependency_prometheus_basic_auth_enabled: false
    control_center_next_gen_dependency_alertmanager_basic_auth_enabled: false
    control_center_next_gen_data_dir: /data/kafka/confluent/c3
    control_center_next_gen_dependency_prometheus_port: 9090
    control_center_next_gen_dependency_alertmanager_port: 9098
    control_center_next_gen_kafka_listener_name: internal_token
    control_center_next_gen_streams_kafka_listener_name: internal_token
    control_center_next_gen_monitoring_interceptor_kafka_listener_name: internal_token
    control_center_next_gen_dependencies_config_path: /app/kafka/confluent/confluent-control-center-next-gen-2.5.0/etc/confluent-control-center
    control_center_next_gen_mds_cert_auth_only: false

    # Service accounts used by CP components
    c3_service_user: c3svc
    c3_service_password: changeit
    sr_service_user: srsvc
    sr_service_password: changeit

    # RBAC / MDS admin identity (used by automation and role binding tasks)
    rbac_enabled: true
    # control node path(if empty, generated auto)
    token_services_public_pem_file: /home/ansible/.ansible/ansible_collections/confluent/platform/playbooks/generated_ssl_files/public.pem
    token_services_private_pem_file: /home/ansible/.ansible/ansible_collections/confluent/platform/playbooks/generated_ssl_files/tokenKeypair.pem
    # install node path(copy mds key file to install node)
    rbac_enabled_public_pem_path: /app/kafka/confluent/etc/public.pem
    rbac_enabled_private_pem_path: /app/kafka/confluent/etc/tokenKeypair.pem

    mds_super_user: akadmin
    mds_super_user_password: changeit
    rbac_super_users:
      - "User:akadmin"
    #control_center_next_gen_additional_system_admins:
    #  - Group:c3-admins
    #  - User:c3svc
    #schema_registry_additional_system_admins:
    #  - Group:c3-admins
    #  - User:c3svc


    # LDAP bind account and directory lookup scope (for MDS/RBAC user/group resolution)
    mds_ldap_user: "cn=akadmin,ou=users,dc=ldap,dc=goauthentik,dc=io"
    mds_ldap_password: changeit
    ldap_url: "ldap://authentik.dev.data.nx-securities.work:389"
    ldap_base_dn: "dc=ldap,dc=goauthentik,dc=io"
    ldap_user_search_base: "ou=users,dc=ldap,dc=goauthentik,dc=io"
    ldap_group_search_base: "ou=groups,dc=ldap,dc=goauthentik,dc=io"
    ldap_user_name_attribute: "cn"
    ldap_user_object_class: "inetOrgPerson"
    ldap_group_object_class: "groupOfUniqueNames"
    ldap_group_member_attribute: "uniqueMember"
    ldap_group_name_attribute: "cn"

    control_center_next_gen_ldap_user: c3svc
    control_center_next_gen_ldap_password: changeit
    schema_registry_ldap_user: srsvc
    schema_registry_ldap_password: changeit


    schema_registry_listener_port: 9081
    schema_registry_config_prefix: "/etc/schema-registry"

    kafka_controller_metrics_reporter_enabled: false
    kafka_broker_metrics_reporter_enabled: false  
    jmxexporter_enabled: true
    jmxexporter_url_remote: false
    #kafka_broker_jmxexporter_enabled: false
    #kafka_controller_jmxexporter_enabled: false
    #schema_registry_jmxexporter_enabled: false
    jmxexporter_jar_url: "/home/ansible/confluent_install/4.utiltiy/etc/jmx_prometheus_javaagent-0.20.0.jar"
    jmxexporter_jar_path: "/app/kafka/confluent/etc/jmx_prometheus_javaagent-0.20.0.jar"
    kafka_controller_jmxexporter_config_path: /app/kafka/confluent/etc/client.yml
    kafka_controller_jmxexporter_config_source_path: /home/ansible/confluent_install/4.utiltiy/etc/client.yml 
    kafka_controller_jmxexporter_port: 9995
    kafka_broker_jmxexporter_config_path: /app/kafka/confluent/etc/client.yml
    kafka_broker_jmxexporter_config_source_path: /home/ansible/confluent_install/4.utiltiy/etc/client.yml
    kafka_broker_jmxexporter_port: 9999
    schema_registry_jmxexporter_config_path: /app/kafka/confluent/etc/client.yml
    schema_registry_jmxexporter_config_source_path: /home/ansible/confluent_install/4.utiltiy/etc/client.yml
    schema_registry_jmxexporter_port: 19999
    enable_node_id: false


    kafka_controller_custom_properties:
      #metric.reporters: io.confluent.telemetry.reporter.TelemetryReporter
      confluent.telemetry.metrics.collector.interval.ms: 60000
      confluent.telemetry.remoteconfig._confluent.enabled: false
      confluent.consumer.lag.emitter.enabled: true

      confluent.balancer.enable: true
      
      num.network.threads: 2
      num.io.threads: 4
      num.partitions: 1
      num.recovery.threads.per.data.dir: 1
      
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
      
      log.retention.hours: 24
      log.segment.bytes: 1073741824
      log.retention.check.interval.ms: 300000
      log.dirs: /data/kafka/confluent/controller
      
      confluent.license: "{{ confluent_license }}"
      
    kafka_broker_custom_properties:
      #metric.reporters: io.confluent.telemetry.reporter.TelemetryReporter
      confluent.telemetry.metrics.collector.interval.ms: 60000
      confluent.telemetry.remoteconfig._confluent.enabled: false
      confluent.consumer.lag.emitter.enabled: true
      
      num.network.threads: 4
      num.io.threads: 8
      num.partitions: 1
      num.recovery.threads.per.data.dir: 4 #default: 4
      
      socket.send.buffer.bytes: 1048576 #default: 102400
      socket.receive.buffer.bytes: 1048576 #default: 102400
      socket.request.max.bytes: 134217728
      num.replica.fetchers: 2 #default: 1
      replica.fetch.max.bytes: 10485760 #default: 1048576
      replica.fetch.response.max.bytes: 31457280 #default: 10485760
      
      log.retention.hours: 24
      log.segment.bytes: 1073741824
      log.retention.check.interval.ms: 300000
      log.dirs: /data/kafka/confluent/broker
      
      confluent.balancer.enable: "true"
      confluent.balancer.heal.uneven.load.trigger: "EMPTY_BROKER"
      confluent.balancer.heal.broker.failure.threshold.ms: 60000 
      auto.create.topics.enable: false
      delete.topic.enable: true
      default.replication.factor: 3
      unclean.leader.election.enable: false
      confluent.license.topic.replication.factor: 3
      
      min.insync.replicas: 2
      confluent.balancer.topic.replication.factor: 3
      confluent.durability.topic.replication.factor: 3
      confluent.tier.metadata.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      offsets.topic.replication.factor: 3
      confluent.metadata.topic.replication.factor: 3
      confluent.reporters.telemetry.auto.enabled: false
      
      confluent.license: "{{ confluent_license }}"
      
      # secret setting
      #config.providers: securepass
      #config.providers.securepass.class: io.confluent.kafka.security.config.provider.SecurePassConfigProvider
      
      confluent.metrics.reporter.publish.ms: 30000

      ldap.java.naming.factory.initial: com.sun.jndi.ldap.LdapCtxFactory
      ldap.com.sun.jndi.ldap.read.timeout: 3000
      ldap.java.naming.provider.url: "ldap://authentik.dev.data.nx-securities.work:389"
      ldap.java.naming.security.principal: "{{ mds_ldap_user }}"
      ldap.java.naming.security.credentials: "{{ mds_ldap_password }}"
      ldap.java.naming.security.authentication: simple
      ldap.user.search.base: "ou=users,dc=ldap,dc=goauthentik,dc=io"
      ldap.group.search.base: "ou=groups,dc=ldap,dc=goauthentik,dc=io"
      ldap.user.name.attribute: cn
      ldap.user.object.class: inetOrgPerson
      ldap.user.memberof.attribute.pattern: "(?i)cn=(.*),ou=groups,dc=ldap,dc=goauthentik,dc=io"
      ldap.group.name.attribute: cn
      ldap.group.member.attribute.pattern: "(?i)cn=(.*),ou=users,dc=ldap,dc=goauthentik,dc=io"

    control_center_next_gen_custom_properties:
      confluent.controlcenter.id: 3

      confluent.controlcenter.internal.topics.replication: 3
      confluent.controlcenter.command.topic.replication: 3
      confluent.controlcenter.ui.autoupdate.enable: false
      confluent.controlcenter.usage.data.collection.enable: true
      confluent.controlcenter.ksql.enable: false
      confluent.controlcenter.schema.registry.enable: true

      # Control Center REST auth mode (user login handled by OIDC below)
      confluent.controlcenter.rest.authentication.method: BEARER
      confluent.controlcenter.auth.sso.mode: OIDC
      confluent.controlcenter.auth.session.expiration.ms: 86400000


      # Control Center -> Kafka (streams + monitoring interceptor clients)
      confluent.controlcenter.streams.sasl.jaas.config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required username="{{ c3_service_user }}" password="{{ c3_service_password }}" metadataServerUrls="https://broker-01.confluent.infomation.dev.data.nx-securities.work:8090,https://broker-02.confluent.infomation.dev.data.nx-securities.work:8090,https://broker-03.confluent.infomation.dev.data.nx-securities.work:8090";
      confluent.controlcenter.streams.sasl.login.callback.handler.class: io.confluent.kafka.clients.plugins.auth.token.TokenUserLoginCallbackHandler
      confluent.monitoring.interceptor.sasl.jaas.config: org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required username="{{ c3_service_user }}" password="{{ c3_service_password }}" metadataServerUrls="https://broker-01.confluent.infomation.dev.data.nx-securities.work:8090,https://broker-02.confluent.infomation.dev.data.nx-securities.work:8090,https://broker-03.confluent.infomation.dev.data.nx-securities.work:8090";
      confluent.monitoring.interceptor.sasl.login.callback.handler.class: io.confluent.kafka.clients.plugins.auth.token.TokenUserLoginCallbackHandler

      # External user -> Control Center (OIDC login against Authentik)
      confluent.oidc.idp.client.id: "6A3rZBHmDQ3Xp6CqyoV4yWsRMHFxF230dW7J2RQR"
      confluent.oidc.idp.client.secret: "lNIIfyoWf0GNopEEITkKboxRVdNVXlEcn6NtlZDgKbY1VdJ0kpEY85e1gmufmpfJlUD3IkMnIsxoTQlpRsnJ7pUsdxTqGcEeJASnshcoymCDkDJCNqu7p3lQqRjQ9s0Q"
      confluent.oidc.idp.issuer: "https://authentik.dev.data.nx-securities.work:9000/"
      confluent.oidc.idp.jwks.endpoint.uri: "https://authentik.dev.data.nx-securities.work:9000/application/o/confluent-control-center/jwks/"
      confluent.oidc.idp.authorize.base.endpoint.uri: "https://authentik.dev.data.nx-securities.work:9000/application/o/authorize/"
      confluent.oidc.idp.token.base.endpoint.uri: "https://authentik.dev.data.nx-securities.work:9000/application/o/token/"
      confluent.oidc.idp.sub.claim.name: preferred_username
      confluent.oidc.idp.groups.claim.name: groups
      confluent.oidc.idp.groups.claim.scope: "openid profile email"
      confluent.oidc.idp.refresh.token.enabled: "true"
      confluent.oidc.session.token.expiry.ms: 86400000
      confluent.oidc.session.max.timeout.ms: 86400000
      confluent.license: "{{ confluent_license }}"

      #confluent.controlcenter.disk.skew.warning.min.bytes: 10737418240

    schema_registry_custom_properties:
      confluent.license: "{{ confluent_license }}"

    kafka_controller_service_environment_overrides:
      JAVA_HOME: /usr/lib/jvm/java-21
      KAFKA_HEAP_OPTS: "-Xms4g -Xmx4g"
      #KAFKA_LOG4J_OPTS: "-Dlog4j.configuration=file:/app/kafka/confluent/etc/log4j2.yaml"
      #KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:MetaspaceSize=256m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M -XX:MinMetaspaceFreeRatio=50 -XX:MaxMetaspaceFreeRatio=80 -Djava.awt.headless -Djava.net.preferIPv4Stack=true"
      #KAFKA_JMX_OPTS: "-Djava.rmi.server.hostname=127.0.0.1 -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=9999 -Dcom.sun.management.jmxremote.authenticate=false  -Dcom.sun.management.jmxremote.ssl=false"

    kafka_broker_service_environment_overrides:
      JAVA_HOME: /usr/lib/jvm/java-21
      KAFKA_HEAP_OPTS: "-Xms8g -Xmx8g"
      #KAFKA_LOG4J_OPTS: "-Dlog4j.configuration=file:/app/kafka/confluent/etc/log4j2.yaml"
      #KAFKA_JVM_PERFORMANCE_OPTS: "-server -XX:MetaspaceSize=256m -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:InitiatingHeapOccupancyPercent=35 -XX:G1HeapRegionSize=16M -XX:MinMetaspaceFreeRatio=50 -XX:MaxMetaspaceFreeRatio=80 -Djava.awt.headless -Djava.net.preferIPv4Stack=true"
      #KAFKA_JMX_OPTS: "-javaagent:/app/kafka/confluent/etc/jmx_prometheus_javaagent-0.20.0.jar=9998:/app/kafka/confluent/etc/kafka_broker.yml -Dcom.sun.management.jmxremote.authenticate=false -Djava.rmi.server.hostname={{ broker_ip }} -Dcom.sun.management.jmxremote=true -Dcom.sun.management.jmxremote.port=9995 -Dcom.sun.management.jmxremote.ssl=false"

    control_center_next_gen_service_environment_overrides:
      JAVA_HOME: /usr/lib/jvm/java-21
      CONTROL_CENTER_HEAP_OPTS: "-Xms8g -Xmx8g"
      #CONTROL_CENTER_LOG4J_OPTS: "-Dlog4j.configuration=file://"
      #CONTROL_CENTER_JVM_PERFORMANCE_OPTS: "-server -XX:+UseConcMarkSweepGC -XX:+CMSParallelRemarkEnabled -XX:ConcGCThreads=4 -XX:ParallelGCThreads=4 -XX:+CMSScavengeBeforeRemark"
      #CONTROL_CENTER_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=8M -XX:InitiatingHeapOccupancyPercent=75 -XX:ConcGCThreads=4 -XX:ParallelGCThreads=4 -XX:+G1UseAdaptiveIHOP"
      #CONTROL_CENTER_JVM_PERFORMANCE_OPTS: "-server -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:G1HeapRegionSize=16m -XX:InitiatingHeapOccupancyPercent=35 -XX:ConcGCThreads=4 -XX:ParallelGCThreads=8"
      #CONTROL_CENTER_OPTS: "-Djava.security.auth.login.config=/app/kafka/confluent/etc/c3_jaas.config"
      
      
    control_center_next_gen_dependency_prometheus_service_environment_overrides:  
      User: cp-control-center
      Group: confluent
      ExecStart: /app/kafka/confluent/confluent-control-center-next-gen-2.5.0/bin/prometheus-start
      TSDB_PATH: /data/kafka/confluent/prometheus/data
      LOG_PATH: /log/kafka/confluent/prometheus
      METRICS_RETENTION_DAYS: "15d"

    control_center_next_gen_dependency_alertmanager_service_environment_overrides:
      User: cp-control-center
      Group: confluent
      ExecStart: /app/kafka/confluent/confluent-control-center-next-gen-2.5.0/bin/alertmanager-start
      STORAGE_PATH: /data/kafka/confluent/alertmanager/data
      LOG_PATH: /log/kafka/confluent/alertmanager
      WEB_LISTEN_ADDRESS: "0.0.0.0:9098"
      CLUSTER_ADVERTISE_ADDRESS: "0.0.0.0:9098"
      CONTROL_CENTER_ALERTMANAGER_HA_ENABLED: false

    schema_registry_service_environment_overrides:
      SCHEMA_REGISTRY_HEAP_OPTS: "-Xms2G -Xmx2G"
      #SCHEMA_REGISTRY_OPTS: " -javaagent:/app/kafka/confluent/etc/jmx_prometheus_javaagent-0.20.0.jar=9097:/app/kafka/confluent/etc/client.yml"

kafka_controller:
  hosts:
    controller-01.confluent.infomation.dev.data.nx-securities.work:
      node_id: 9991
    controller-02.confluent.infomation.dev.data.nx-securities.work:
      node_id: 9992
    controller-03.confluent.infomation.dev.data.nx-securities.work:
      node_id: 9993

kafka_broker:
  hosts:
    broker-01.confluent.infomation.dev.data.nx-securities.work:
      broker_id: 1
    broker-02.confluent.infomation.dev.data.nx-securities.work:
      broker_id: 2
    broker-03.confluent.infomation.dev.data.nx-securities.work:
      broker_id: 3

control_center_next_gen:
  hosts:
    cc-01.confluent.infomation.dev.data.nx-securities.work:

schema_registry:
  hosts:
    sr-01.confluent.infomation.dev.data.nx-securities.work:
    sr-02.confluent.infomation.dev.data.nx-securities.work:
